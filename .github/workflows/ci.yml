name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system compiler
        run: sudo apt-get update && sudo apt-get install --yes gfortran make

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Check formatting and static errors
        run: python -m ruff check .

      - name: Run source-only tests
        run: python -m unittest discover -s tests -v
